<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trollmeight.me</title>
    <link rel="stylesheet" type="text/css" href="customizations/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <script defer src="https://umami.trollmeight.me/script.js" data-website-id="22c1ac6a-4d92-44cf-96d5-967cdde362cf"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <nav class="nav">
        <a href="https://trollmeight.me/" class="navbtn active">
            <span class="material-symbols-outlined">home</span>
            Home
        </a>
        <a href="https://trollmeight.me/about/" class="navbtn">
            <span class="material-symbols-outlined">account_circle</span>
            About
        </a>
        <a href="https://trollmeight.me/projects/" class="navbtn">
            <span class="material-symbols-outlined">inventory_2</span>
            Projects
        </a>
    </nav>

    <div class="container">
        <img class="pfp" src="https://cdn.discordapp.com/avatars/1266754182082461751/32bf30d2a5f6eb47e11bd2b72bab811c.webp?size=1024" alt="dog">
        <div class="username">
            <h1 class="trollmeight">trollmeight</h1>
            <i>horse</i>
        </div>
    </div>
    <footer class="horsering">
        <div class="webring">
            <a href="https://horser.ing/prev/trollmeight" class="ring">←</a>
            <a href="https://horser.ing" class="ring">horsering</a>
            <a href="https://horser.ing/rand" class="ring">🐴</a>
            <a href="https://horser.ing/next/trollmeight" class="ring">→</a>
        </div>
        <span class="dot">•</span>
        <div class="time">
            It's <span id="clock" class="timebadge">00:00</span> in my timezone
        </div>
    </footer>

    <script>
        function clock() {
            const options = {
                timeZone: 'America/Chicago',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            };
            
            const formatter = new Intl.DateTimeFormat('en-US', options);
            document.getElementById('clock').textContent = formatter.format(new Date());
        }

        clock();
        setInterval(clock, 1000);
    </script>
</body>
</html>
