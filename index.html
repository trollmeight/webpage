<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trollmeight</title>
    <link rel="stylesheet" type="text/css" href="customization/styles.css">
    <link rel="icon" type="image/x-icon" href="customization/favicon.ico">
    <meta property="og:title" content="trollmeight" />
    <meta property="og:description" content="trollmeight's personal website, a small corner on the internet" />
    <meta property="og:url" content="https://trollmeight.me" />
    <meta property="og:image" content="https://trollmeight.me/customization/favicon.ico" />
    <meta name="theme-color" content="#FFFFFF" /> 
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <nav class="nav">
        <a href="https://trollmeight.me/" class="navbtn active">
            <span class="material-symbols-outlined">home</span>
            Home
        </a>
        <a href="https://trollmeight.me/about/" class="navbtn">
            <span class="material-symbols-outlined">account_circle</span>
            About
        </a>
        <a href="https://trollmeight.me/projects/" class="navbtn">
            <span class="material-symbols-outlined">inventory_2</span>
            Projects
        </a>
    </nav>

    <div class="container">
        <img class="pfp" src="https://cdn.discordapp.com/avatars/1266754182082461751/32bf30d2a5f6eb47e11bd2b72bab811c.webp?size=1024" alt="dog">
        <div class="username">
            <h1 class="trollmeight">trollmeight</h1>
            <i id="status" class="status">Nothing to see here...</i>
        </div>
    </div>

    <footer class="horsering">
        <div class="webring">
            <a href="https://horser.ing/prev/trollmeight" class="ring">←</a>
            <a href="https://horser.ing" class="ring">horsering</a>
            <a href="https://horser.ing/rand" class="ring">🐴</a>
            <a href="https://horser.ing/next/trollmeight" class="ring">→</a>
        </div>
        <span class="dot">•</span>
        <div class="time">
            It's <span id="clock" class="timebadge">00:00</span> in my timezone
        </div>
    </footer>
    <script>
            async function clock() {
                try {
                    const res = await fetch('/api/time');
                    const data = await res.json();
                    document.getElementById('clock').textContent = data.time;
                } catch {
                    // Keep previous time if fetch fails
                }
            }

            async function discord() {
                const statusTag = document.getElementById('status');
                try {
                    const res = await fetch('/api/lanyard');
                    const data = await res.json();
                    statusTag.textContent = data.status || 'Nothing to see here...';
                } catch {
                    statusTag.textContent = 'Nothing to see here...';
                }
            }

            clock();
            setInterval(clock, 1000);

            discord();
            setInterval(discord, 30000);
    </script>
</body>
</html>
